# ABOUTME: Push/PR continuous integration: fmt, clippy, test, and build on
# ABOUTME: native Linux, Windows, and macOS runners (no cross-compilation).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lint run once on Linux: they are platform-independent and
  # there is no value in paying for three runners to repeat them.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI build dependencies
        run: ci/linux/apt-deps.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build + test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: ci/linux/apt-deps.sh
      - run: cargo test --workspace --all-targets
      - run: cargo build --workspace --release
