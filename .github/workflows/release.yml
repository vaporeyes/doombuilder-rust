# ABOUTME: On a v* tag, builds native bundles (Linux AppImage, macOS universal
# ABOUTME: .dmg, Windows installer) and publishes them to a GitHub Release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # required for the release job to create the Release

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ci/linux/apt-deps.sh
      - name: Package AppImage
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ci/linux/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  macos:
    name: macOS universal .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package .dmg
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ci/macos/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package installer
        shell: pwsh
        run: |
          $env:VERSION = "${env:GITHUB_REF_NAME}".TrimStart("v")
          ci/windows/package-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe

  release:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
